# Configuration Framework Symfony pour SantéClaire

framework:
    secret: '%env(APP_SECRET)%'
    
    http_method_override: false
    handle_all_throwables: true

    # Configuration du serializer
    serializer:
        enable_attributes: true

    # Validation
    validation:
        email_validation_mode: html5

    # Routing avec attributs PHP (pas annotations)
    router:
        utf8: true

    # Session (désactivée pour API stateless)
    session:
        enabled: false

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file